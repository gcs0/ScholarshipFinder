{% extends "scholarships/base.html" %}

{% block title %}Register — ScholarshipFinder{% endblock %}

{% block content %}
    <section aria-labelledby="form-heading">
        <h1 id="form-heading">Create Your Profile</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>

        <p><a href="{% url 'home' %}">Cancel</a></p>
    </section>
{% endblock %}
